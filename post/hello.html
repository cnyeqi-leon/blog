  <h1>从今天开始写</h1>
  <div class="body"><p>这个站放我自己写的东西：想到的、看到的、拍下来的。</p>
<p>不分长短，也不用凑字数——想写就写，写完就发。</p>
<h2><span class="mk">会写什么</span></h2>
<ul>
<li>骑车和夜骑路上看到的</li>
<li>拍的照片</li>
<li>看书、看新闻之后的想法</li>
<li>自己折腾出来的东西（记录，不放成品）</li>
</ul>
<h2><span class="mk">不会写什么</span></h2>
<p>不抄、不搬运、不放别人的东西。内部用的文档、工作资料一律不放这里。</p>
<p>右边是我的微信二维码，想看什么、想聊什么直接说。</p>
</div>
